---

- name: "Install and configure Wordpress and supporting software"
  hosts: "wordpress_servers"
  gather_facts: true
  become: true
  become_method: "ansible.builtin.sudo"

  vars_files:
    - "group_vars/common.yml"

  roles:
    - role: "stack_install"
      tags: "stack_install"

    - role: "stack_config"
      tags: "stack_config"

    - role: "wordpress"
      tags: "wordpress"